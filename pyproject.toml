[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance"
version = "0.2.0"
description = "RESONANCE: a generative audio engine and daily-driver player -- binaural entrainment tones, 808 drum synthesis + arpeggiator, ABC 2.1 notation, headless visuals, plugins, render-job API, ffmpeg conversion, ID3v2.4 tagging, lyrics/karaoke, stem separation + mixer, 3D spatial audio, CD ripping, and a skinnable UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [
    { name = "Johnathan 'Κασπάρρ' Monroe", email = "root@axoneme.org" },
]
keywords = ["audio", "binaural", "synthesis", "generative", "abc-notation",
            "dsp", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
# The one runtime dependency: everything DSP runs on numpy. Backends
# (matplotlib, ffmpeg, fastapi/uvicorn) stay optional behind lazy
# imports so each module installs standalone.
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# Per-module extras: install exactly the pillar you want.
binaural = []                                  # binaural tones (numpy only)
synth = []                                     # 808 synth + sequencer (numpy only)
abc = []                                       # ABC notation (stdlib + numpy)
viz = []                                       # headless SVG frames (stdlib only)
plugins = []                                   # plugin manager (stdlib only)
edit = []                                      # core.edit editing primitives (numpy)
api = ["fastapi", "uvicorn"]                   # render-job HTTP service
tags = ["mutagen"]                           # ID3v2.4 tagging
full = ["fastapi", "uvicorn", "mutagen"]      # every optional backend at once

[project.urls]
Homepage = "https://github.com/Qasparr/resonance"
Repository = "https://github.com/Qasparr/resonance"
License = "https://www.gnu.org/licenses/agpl-3.0.html"

[project.scripts]
resonance-serve = "resonance.api.serve:main"
resonance-binaural = "resonance.binaural.cli:main"
resonance-808 = "resonance.synth.cli:main"
resonance-abc = "resonance.abc.cli:main"
resonance-viz = "resonance.viz.cli:main"
resonance-diag = "resonance.diagnostics.cli:main"
resonance-edit = "resonance.core.cli:main"
resonance-play = "resonance.player.cli:main"
resonance-convert = "resonance.convert.cli:main"
resonance-tag = "resonance.tags.cli:main"
resonance-lyrics = "resonance.metadata.cli:main"
resonance-stems = "resonance.stems.cli:main"
resonance-spatial = "resonance.spatial.cli:main"
resonance-rip = "resonance.rip.cli:main"
resonance-ui = "resonance.ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["resonance*"]

[tool.setuptools.package-data]
"*" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
